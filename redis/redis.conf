# Redis Configuration for BrainNav Distributed Segmentation
# Path: redis/redis.conf

# Network & Binding
port 6379
bind 0.0.0.0
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
pidfile /var/run/redis.pid
loglevel notice
logfile ""
databases 16
always_show_logo yes

# Persistence - RDB (Redis Database)
save 900 1      # Save if 900 sec (15 min) and at least 1 key changed
save 300 10     # Save if 300 sec (5 min) and at least 10 keys changed
save 60 10000   # Save if 60 sec (1 min) and at least 10000 keys changed
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistence - AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec    # Fsync every second (good balance)
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru   # Remove any key using LRU eviction policy when max memory reached

# Eviction - for cache-aside pattern
# When keys expire or maxmemory is reached, Redis will evict keys
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# Key Expiration
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Protocol
hz 10

# Dynamic Threshold for HyperLogLog
hll-sparse-max-bytes 3000

# Streaming
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Min-slaves-to-write (for replication if needed)
min-slaves-to-write 0

# Authentication (if needed)
# requirepass your_password_here

# Disable dangerous commands in production (optional)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Replication settings (for single-instance, not needed)
# replicaof no one

# Tuning
# Increase from default 10000 for high throughput
slowlog-log-slower-than 10000
slowlog-max-len 128

# Redis Modules (if any)
# loadmodule /usr/lib/redis/modules/mymodule.so
